<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Community Auction</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="brand">
    <img src="images/canalside-header.jpg" alt="Canalside Community Food — a community supported agriculture scheme" width="970" height="170">
  </div>
  <header class="site-header">
    <div class="wrap">
      <h1 id="page-title">Community Auction</h1>
      <div id="intro" class="intro"></div>
      <p id="status" class="status" aria-live="polite"></p>
    </div>
  </header>

  <main class="wrap">
    <div id="notices"></div>
    <div id="items" class="items" aria-live="polite">
      <p class="loading">Loading items…</p>
    </div>
  </main>

  <footer class="site-footer wrap">
    <p id="privacy"><strong>Privacy note: </strong>Your name and bid amount will be shown publicly; contact details are kept private.</p>
    <p><strong>Lots are collected by Canalside Community member Xandra Gilchrist. Page developed by Canalside Community member Cagatay Turkay with help from Claude, the AI. </strong></p>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
